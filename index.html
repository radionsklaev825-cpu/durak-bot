<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --felt:#1f4d3a; --felt-d:#143527; --felt-l:#2b6350;
  --paper:#fbf8f0; --ink:#1b1b1b; --red:#c23b2e; --gold:#e3b64b; --text:#f1ece0; --dim:#a9c0b3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--felt-d);color:var(--text);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background:radial-gradient(120% 80% at 50% 35%,var(--felt-l),var(--felt) 55%,var(--felt-d))}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.trump{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.trump .card{width:34px;height:48px;border-radius:6px;padding:2px 0}
.trump .card b{font-size:12px}.trump .card i{font-size:17px}
.ghost{background:none;border:1px solid rgba(255,255,255,.25);color:var(--text);border-radius:10px;padding:6px 10px;font-size:13px}
.seats{display:flex;gap:8px;padding:0 14px 6px;overflow-x:auto}
.seat{flex:0 0 auto;min-width:84px;padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1.5px solid transparent;font-size:13px}
.seat .n{font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .s{color:var(--dim);font-size:12px}
.seat.att{border-color:var(--gold)}.seat.def{border-color:#7fd1ff}
.seat.off{opacity:.55}
.felt{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px}
.pair{position:relative;width:62px;height:92px}
.pair .card{position:absolute;left:0;top:0}
.pair .card.d{left:14px;top:14px}
.pair.sel .card:first-child{outline:3px solid #7fd1ff}
.empty{color:var(--dim);text-align:center;width:100%}
.card{width:56px;height:82px;flex:0 0 auto;background:var(--paper);color:var(--ink);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;
  font-family:Georgia,"Times New Roman",serif;box-shadow:0 2px 5px rgba(0,0,0,.35);user-select:none}
.card b{font-size:20px;line-height:1}.card i{font-style:normal;font-size:30px;line-height:1}
.card.red{color:var(--red)}
.card.trump{box-shadow:0 0 0 2px var(--gold),0 2px 5px rgba(0,0,0,.35)}
.info{padding:4px 14px;text-align:center;min-height:42px}
.info .log{color:var(--dim);font-size:13px}.info .hint{font-weight:600}
.acts{display:flex;gap:10px;justify-content:center;padding:6px 14px;min-height:50px}
.btn{border:0;border-radius:12px;padding:11px 22px;font-size:16px;font-weight:600;background:var(--gold);color:#2a2000}
.btn.sec{background:rgba(255,255,255,.14);color:var(--text)}
.hand{display:flex;padding:14px 14px 16px;overflow-x:auto;min-height:118px;align-items:flex-end}
.hand .card{margin-right:-16px;transition:transform .12s,opacity .12s;opacity:.5}
.hand .card.ok{opacity:1;transform:translateY(-12px)}
.hand .card:last-child{margin-right:0}
.panel{margin:auto;width:min(92%,380px);background:rgba(0,0,0,.28);border-radius:18px;padding:22px 20px;text-align:center}
.panel h1{font:700 28px Georgia,serif;margin:0 0 6px}
.panel p{margin:4px 0 14px;color:var(--dim)}
.panel ul{list-style:none;padding:0;margin:0 0 16px;text-align:left}
.panel li{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.panel .btn{width:100%;margin-top:8px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $app = document.getElementById('app');
let ws, S = null, sel = null, retry = 0, fatal = false;

function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }
function send(t, extra) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ t }, extra || {}))); }
function btn(text, cls, fn) { const b = h('button', 'btn ' + (cls || ''), text); b.onclick = fn; return b; }
function panel(title, sub) { const p = h('div', 'panel'); p.append(h('h1', '', title)); if (sub) p.append(h('p', '', sub)); return p; }

function card(c) {
  const suit = c.slice(-1), rank = c.slice(0, -1);
  const e = h('div', 'card' + ('♥♦'.includes(suit) ? ' red' : '') + (S && suit === S.trump ? ' trump' : ''));
  e.append(h('b', '', rank), h('i', '', suit));
  return e;
}

function connect() {
  if (!tg || !tg.initData) { show(panel('Дурак', 'Откройте игру в Telegram: напишите /play в группе и нажмите кнопку.')); return; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ initData: tg.initData })); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.fatal) { fatal = true; show(panel('Нет доступа', m.fatal)); return; }
    if (m.err) { toast(m.err); return; }
    S = m; render();
  };
  ws.onclose = () => { if (!fatal) { if (!S) show(panel('Подключаемся…', 'Сервер просыпается, это может занять до минуты.')); setTimeout(connect, Math.min(1000 * ++retry, 5000)); } };
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send('{"t":"ping"}'); }, 25000);

function show(...nodes) { $app.replaceChildren(...nodes); }
const meP = () => S.players.find(p => p.id === S.me);

function render() {
  if (S.phase === 'lobby') return renderLobby();
  renderGame();
}

function renderLobby() {
  const p = panel('Дурак', 'Стол для участников вашей группы');
  const ul = h('ul');
  S.players.forEach(x => ul.append(h('li', '', x.name + (x.id === S.me ? ' (вы)' : ''))));
  if (!S.players.length) ul.append(h('li', '', 'За столом пока никого'));
  p.append(ul);
  const seated = !!meP();
  if (!seated) p.append(btn('Сесть за стол', '', () => send('join')));
  else {
    if (S.players.length >= 2) p.append(btn('Начать игру', '', () => send('start')));
    else p.append(h('p', '', 'Нужен ещё хотя бы один игрок'));
    p.append(btn('Выйти из-за стола', 'sec', () => send('leave')));
  }
  if (S.watching) p.append(h('p', '', 'Смотрят: ' + S.watching));
  show(p);
}

function renderGame() {
  const me = meP();
  const top = h('div', 'bar');
  const tr = h('div', 'trump');
  if (S.trump_card) tr.append(card(S.trump_card));
  tr.append(h('span', '', 'Козырь ' + S.trump + ' · в колоде ' + S.deck));
  top.append(tr);
  if (me) {
    const end = h('button', 'ghost', 'Завершить');
    end.onclick = () => {
      const go = () => send('reset');
      if (tg && tg.showConfirm) tg.showConfirm('Завершить игру для всех?', ok => ok && go());
      else if (confirm('Завершить игру для всех?')) go();
    };
    top.append(end);
  }

  const seats = h('div', 'seats');
  S.players.forEach(p => {
    const s = h('div', 'seat' + (p.att ? ' att' : '') + (p.def ? ' def' : '') + (!p.online || p.out ? ' off' : ''));
    s.append(h('div', 'n', p.name + (p.id === S.me ? ' (вы)' : '')));
    const tags = [p.out ? 'вышел' : p.n + ' карт'];
    if (p.att) tags.push('⚔'); if (p.def) tags.push('🛡'); if (p.passed) tags.push('✓');
    s.append(h('div', 's', tags.join(' ')));
    seats.append(s);
  });

  const felt = h('div', 'felt');
  if (!S.table.length) felt.append(h('div', 'empty', 'Стол пуст'));
  const iDef = me && me.def && !S.taking;
  S.table.forEach(([a, d]) => {
    const pr = h('div', 'pair' + (sel === a ? ' sel' : ''));
    pr.append(card(a));
    if (d) { const dc = card(d); dc.classList.add('d'); pr.append(dc); }
    else if (iDef) pr.onclick = () => { sel = sel === a ? null : a; render(); };
    felt.append(pr);
  });

  const info = h('div', 'info');
  info.append(h('div', 'hint', S.phase === 'over' ? '' : S.hint), h('div', 'log', S.log));

  const acts = h('div', 'acts');
  if (S.actions.includes('take')) acts.append(btn('Беру', 'sec', () => { sel = null; send('take'); }));
  if (S.actions.includes('done')) acts.append(btn(S.taking ? 'Готово' : 'Бито', '', () => send('done')));

  const hand = h('div', 'hand');
  S.hand.forEach(c => {
    const e = card(c);
    if (S.legal.includes(c)) e.classList.add('ok');
    e.onclick = () => {
      if (!S.legal.includes(c)) return toast('Эту карту сейчас нельзя сыграть');
      if (me.def) send('defend', { card: c, target: sel }); else send('attack', { card: c });
      sel = null;
    };
    hand.append(e);
  });

  show(top, seats, felt, info, acts, hand);
  if (S.phase === 'over') renderOver();
}

function renderOver() {
  const loser = S.players.find(p => p.id === S.loser);
  const p = panel(loser ? 'Дурак: ' + loser.name : 'Ничья', loser ? (loser.id === S.me ? 'В этот раз не повезло' : 'Партия окончена') : 'Все избавились от карт');
  if (meP()) p.append(btn('Новая игра', '', () => send('reset')));
  show(p);
}

connect();
</script>
</body>
</html>
