<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мясокомбинат</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#e3b64b;--text:#f4efe3;--dim:#a8c1b3;--bg1:#2b6350;--bg2:#142a20}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg2);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
body{background:radial-gradient(120% 70% at 50% 0,var(--bg1),var(--bg2) 70%) fixed;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:460px;margin:0 auto;padding:12px 12px 28px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ttl{font:700 22px Georgia,serif;color:var(--gold)}
.chips{display:flex;gap:6px}
.chip{padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.3);box-shadow:0 0 0 1px rgba(255,255,255,.12);font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bed{position:relative;aspect-ratio:1;border:0;border-radius:18px;padding:6px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font:inherit;font-size:12px;
background:linear-gradient(160deg,#6b4a2b,#3f2a16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),0 4px 10px rgba(0,0,0,.3)}
.bed .ic{font-size:34px;line-height:1}
.bed b{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bed.empty{background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);color:var(--dim)}
.bed.empty.can{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold)}
.bed.lock{background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--dim);opacity:.7}
.bed.lock.next{opacity:1;box-shadow:inset 0 0 0 2px rgba(227,182,75,.6);color:var(--gold)}
.bed.grow .ic{opacity:.55;filter:grayscale(.4)}
.bed.rdy{box-shadow:inset 0 0 0 3px var(--gold),0 0 16px rgba(227,182,75,.55)}
.bed.rdy .ic{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) scale(1.08)}}
.pb{position:absolute;left:10px;right:10px;bottom:7px;height:4px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden}
.pb i{display:block;height:100%;background:var(--gold)}
.box{border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(0,0,0,.3));box-shadow:0 0 0 1px rgba(255,255,255,.1),0 8px 20px rgba(0,0,0,.25);padding:14px;margin-top:12px}
.box h3{margin:0 0 10px;font:700 17px Georgia,serif;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.box h3 small{font:500 12.5px system-ui;color:var(--dim)}
.btn{border:0;border-radius:14px;padding:11px 18px;font:700 15px system-ui;background:linear-gradient(#f0c75a,#d9a634);color:#2a2000;box-shadow:0 3px 0 #a47a16}
.btn.sec{background:rgba(255,255,255,.14);color:var(--text);box-shadow:none}
.btn:disabled{opacity:.4}
.btn.wide{width:100%;margin-top:10px}
.seeds{display:flex;flex-wrap:wrap;gap:7px}
.sd{border:0;border-radius:12px;padding:7px 11px;background:rgba(0,0,0,.3);color:var(--text);font:600 14px system-ui;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sd.on{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(227,182,75,.18)}
.note{color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.row:first-of-type{border-top:0}
.row .ic{font-size:28px}.row .n{flex:1;min-width:0}.row .n b{display:block}
.row .n small{color:var(--dim);font-size:12.5px}
.row .btn{padding:8px 11px;font-size:13px}
.rr{font-size:11.5px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.12);margin-left:5px;font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#000d;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:9;text-align:center}
#toast.on{opacity:1}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;min-width:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.fh b{font:700 18px Georgia,serif}.fh span{color:var(--dim);font-size:13px}
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0 2px}
.dots button{width:9px;height:9px;padding:0;border:0;border-radius:9px;background:rgba(255,255,255,.25)}
.dots button.on{background:var(--gold);width:22px}
.lockf{text-align:center;padding:34px 16px}.lockf .big{font-size:52px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:0;border-radius:14px;padding:10px;font:700 14px system-ui;background:rgba(0,0,0,.3);color:var(--dim)}
.tab.on{background:var(--gold);color:#2a2000}
.mid{text-align:center;padding:60px 20px}
.meter{height:10px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin:12px 0 6px}
.meter i{display:block;height:100%;background:var(--gold)}
</style>
</head>
<body>
<div id="app"><div class="mid"><h2 class="ttl">🥩 Мясокомбинат</h2><p class="note">Загрузка…</p></div></div>
<div id="toast"></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const app = document.getElementById('app');
let S = null, busy = false, t0 = 0, cr = [];
const RC = { common: '#d9d9d9', uncommon: '#7fe08a', rare: '#7fb8ff', epic: '#c79bff', legendary: '#ffb25c', mythic: '#ff7a7a' };
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
const dur = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} ч ${m} мин` : m ? `${m} мин ${s % 60} с` : `${s} с`; };
function h(tag, cls, ...kids) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  kids.forEach(k => { if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(k)); });
  return e;
}
function btn(text, cls, fn, dis) { const b = h('button', 'btn ' + (cls || ''), text); b.disabled = !!dis; b.onclick = fn; return b; }
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); }
function hap(k) { try { tg.HapticFeedback.notificationOccurred(k); } catch (e) {} }
function ask(msg, ok) { if (tg && tg.showConfirm) tg.showConfirm(msg, y => { if (y) ok(); }); else if (confirm(msg)) ok(); }

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function setState(s) { S = s; t0 = Date.now(); render(); }
async function load() {
  try { setState(await api('/api/meat')); }
  catch (e) { app.replaceChildren(h('div', 'mid', h('h2', 'ttl', 'Нет связи'), h('p', 'note', 'Сервер просыпается или вы открыли не из Telegram.'), btn('Повторить', '', load))); }
}
async function act(name, body, ok) {
  if (busy) return; busy = true;
  try {
    const r = await api('/api/meat/' + name, body || {});
    if (r.state) setState(r.state);
    if (r.error) { toast(r.error); hap('error'); } else { hap('success'); if (ok) toast(ok(r)); }
  } catch (e) { toast('Нет связи, попробуйте ещё раз'); }
  busy = false;
}

function lockedView(kids) {
  const s = S;
  if (s.coop_done) {
    kids.push(h('div', 'box lockf', h('div', 'big', '🔓'), h('h3', '', 'Курятник прокачан!'),
      h('p', 'note', 'Курятник полностью прокачан, теперь можно открыть мясокомбинат: растить животных, кормить и поить их, а потом забивать на мясо.'),
      btn(`🥩 Открыть мясокомбинат · ${fmt(s.meat_cost)} ♠️`, 'wide' + (s.coins >= s.meat_cost ? '' : ' sec'), () => act('unlock', {}, () => '🎉 Мясокомбинат открыт!'))));
    return;
  }
  const m = h('div', 'meter', h('i')); m.firstChild.style.width = (100 * s.coop_cells / s.coop_total) + '%';
  kids.push(h('div', 'box lockf', h('div', 'big', '🔒'), h('h3', '', 'Мясокомбинат заблокирован'),
    h('p', 'note', `Прокачайте курятник до конца: откройте все 3 страницы и все ${s.coop_total} ячеек. После этого мясокомбинат можно будет открыть за ${fmt(s.meat_cost)} ♠️.`),
    m, h('p', 'note', `Страниц курятника: ${s.coop_pages} из 3 · ячеек: ${s.coop_cells} из ${s.coop_total}`),
    btn('🐔 В курятник', 'wide', () => { location.href = '/coop' + location.hash; })));
}

const sh = s => s <= 0 ? '⚠' : s >= 3600 ? Math.ceil(s / 3600) + 'ч' : Math.ceil(s / 60) + 'м';
let cpIdx = 0, reloading = false;
function plantView(kids) {
  const s = S, c = s.plant, el = () => (Date.now() - t0) / 1000;
  const an = id => c.cat.find(x => x.id === id);
  const badge = k => { const [ri, rn] = s.rarity[k.rarity], e = h('span', 'rr', `${ri} ${rn}`); e.style.color = RC[k.rarity]; return e; };
  const grownNow = (a, k) => Math.min(k.grow, a.grown + Math.max(0, Math.min(el(), a.fed_left, a.wat_left)));
  const cellMenu = (slot, k, ready) => {
    const buttons = ready
      ? [{ id: 'slaughter', type: 'default', text: '🔪 Забить' }, { id: 'sell', type: 'default', text: `💰 Продать за ${fmt(k.price / 2)}` }, { type: 'cancel' }]
      : [{ id: 'feed', type: 'default', text: `🍖 Покормить · ${fmt(k.food)} ♠️` }, { id: 'water', type: 'default', text: '💧 Напоить · бесплатно' }, { type: 'cancel' }];
    const run = id => {
      if (id === 'slaughter') act('slaughter', { slot }, r => `🔪 +${r.pieces} кусков мяса`);
      else if (id === 'sell') act('sellanimal', { slot }, () => 'Животное продано');
      else if (id === 'feed') act('feed', { slot }, () => '🍖 Накормлено');
      else if (id === 'water') act('water', { slot }, () => '💧 Напоено');
    };
    if (tg && tg.showPopup) tg.showPopup({ title: `${k.icon} ${k.name}`, message: ready ? 'Животное выросло.' : 'Что сделать?', buttons }, run);
    else run(ready ? 'slaughter' : 'feed');
  };

  const pager = h('div', 'pager'), dots = h('div', 'dots');
  for (let p = 0; p < 3; p++) {
    const pg = h('div', 'page');
    if (p < c.pages) {
      const g = h('div', 'grid');
      for (let i = 0; i < c.per_page; i++) {
        const slot = p * c.per_page + i, a = c.animals.find(x => x.slot === slot);
        if (i >= c.cells[p]) {
          const next = i === c.cells[p];
          const b = h('button', 'bed lock' + (next ? ' next' : ''), h('span', 'ic', '🔒'), h('b', '', next ? fmt(c.cell_cost) + ' ♠️' : 'Закрыто'));
          b.onclick = () => next ? act('buycell', { page: p }, () => 'Ячейка открыта!') : toast('Сначала откройте предыдущую ячейку');
          g.append(b);
        } else if (!a) {
          g.append(h('div', 'bed empty', h('span', 'ic', '🪹'), h('b', '', 'Пусто')));
        } else {
          const k = an(a.animal), t = h('span', ''), bar = h('i'), b = h('button', 'bed', h('span', 'ic', k.icon), h('b', '', k.name), t, h('div', 'pb', bar));
          t.style.fontSize = '11px';
          const upd = () => {
            const gr = grownNow(a, k), f = Math.max(0, a.fed_left - el()), w = Math.max(0, a.wat_left - el());
            const ready = gr >= k.grow - 0.5;
            bar.style.width = (100 * gr / k.grow) + '%';
            t.textContent = ready ? 'Готово!' : `${Math.floor(100 * gr / k.grow)}% 🍖${sh(f)} 💧${sh(w)}`;
            b.classList.toggle('rdy', ready);
            return ready ? true : undefined;
          };
          const ready0 = grownNow(a, k) >= k.grow - 0.5;
          if (ready0) { upd(); } else { upd(); cr.push(upd); }
          b.onclick = () => cellMenu(slot, k, grownNow(a, k) >= k.grow - 0.5);
          g.append(b);
        }
      }
      pg.append(h('div', 'fh', h('b', '', `🥩 Страница ${p + 1}`), h('span', '', `ячеек ${c.cells[p]} из ${c.per_page}`)), g);
    } else if (p === c.pages) {
      const ok = c.page_ready;
      pg.append(h('div', 'box lockf', h('div', 'big', '🔒'), h('h3', '', `Страница ${p + 1}`),
        h('p', 'note', ok ? `Прокачка до уровня ${p + 1} открывает ещё ${c.per_page} ячеек.` : `Откройте все ${c.per_page} ячеек страницы ${p}, и можно будет прокачаться до уровня ${p + 1}.`),
        btn(`⬆️ Прокачать до ${p + 1} уровня · ${fmt(c.page_cost)} ♠️`, 'wide' + (ok && s.coins >= c.page_cost ? '' : ' sec'), () => ok ? act('pageup', {}, () => `🎉 Открыта страница ${p + 1}!`) : toast(`Сначала откройте все ячейки страницы ${p}`))));
    } else {
      pg.append(h('div', 'box lockf', h('div', 'big', '🔒'), h('h3', '', `Страница ${p + 1}`), h('p', 'note', `Откроется после прокачки страницы ${p}.`)));
    }
    pager.append(pg);
    const d = h('button', p === cpIdx ? 'on' : ''); d.onclick = () => pager.scrollTo({ left: p * pager.clientWidth, behavior: 'smooth' }); dots.append(d);
  }
  pager.addEventListener('scroll', () => { const i = Math.round(pager.scrollLeft / pager.clientWidth); if (i !== cpIdx) { cpIdx = i; [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i)); } });
  kids.push(pager, dots);
  setTimeout(() => { pager.scrollLeft = cpIdx * pager.clientWidth; }, 0);

  const feedCost = c.animals.reduce((x, a) => { const k = an(a.animal); return x + (a.fed_left < k.care * c.feed_ok ? k.food : 0); }, 0);
  const row = h('div', 'seeds');
  row.style.marginTop = '10px';
  [btn(`🍖 Покормить всех · ${fmt(feedCost)} ♠️`, 'sec', () => act('feed', {}, r => `🍖 Накормлено: ${r.n}, −${fmt(r.cost)} ♠️`)),
   btn('💧 Напоить всех', 'sec', () => act('water', {}, r => `💧 Напоено: ${r.n}`)),
   btn('🔪 Забить готовых', '', () => act('slaughter', {}, r => `🔪 Забито: ${r.n}, мяса: ${r.pieces}`))].forEach(b => row.append(b));
  kids.push(row);

  const ids = Object.keys(c.meat), total = ids.reduce((x, id) => x + an(id).meat * c.meat[id], 0);
  const mb = h('div', 'box', h('h3', '', 'Мясо', h('small', '', `${c.pieces} куска с каждого животного`)));
  if (!ids.length) mb.append(h('p', 'note', 'Пока пусто. Выращивайте животных, кормите, поите и забивайте.'));
  else {
    const w = h('div', 'seeds');
    ids.forEach(id => { const k = an(id), sp = h('span', 'sd', `🥩 ${k.name} ×${c.meat[id]}`); sp.style.color = RC[k.rarity]; w.append(sp); });
    mb.append(w, btn(`💰 Продать мясо за ${fmt(total)} ♠️`, 'wide', () => act('sellmeat', {}, r => `💰 +${fmt(r.sold)} ♠️`)));
  }
  kids.push(mb);

  const timer = h('small', ''), sb = h('div', 'box', h('h3', '', 'Магазин животных', timer));
  const tu = () => { const l = c.shop_in - el(); timer.textContent = 'обновится через ' + dur(l); if (l < -1 && !busy && !reloading) { reloading = true; load().finally(() => { reloading = false; }); } };
  tu(); cr.push(tu);
  c.shop.forEach(id => {
    const k = an(id);
    sb.append(h('div', 'row', h('span', 'ic', k.icon),
      h('div', 'n', h('b', '', k.name, badge(k)), h('small', '', `растёт ${dur(k.grow)} · мясо ${fmt(k.meat)} ♠️ × ${c.pieces}`)),
      btn(`${fmt(k.price)} ♠️`, s.coins >= k.price ? '' : 'sec', () => act('buyanimal', { animal: k.id }, () => `${k.icon} ${k.name} в мясокомбинате`))));
  });
  kids.push(sb);
}

function render() {
  cr = [];
  const s = S, kids = [];
  kids.push(h('div', 'top', h('div', 'ttl', '🥩 Мясокомбинат'), h('div', 'chips', h('div', 'chip', fmt(s.coins) + ' ♠️'), h('div', 'chip', fmt(s.jokers) + ' 🃏'))));
  if (s.unlocked) plantView(kids); else lockedView(kids);
  app.replaceChildren(...kids);
  tick();
}
function tick() {
  if (!S) return;
  let changed = false;
  cr.forEach(f => { if (f() === true) changed = true; });
  if (changed) render();
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load(); });
load();
</script>
</body>
</html>
